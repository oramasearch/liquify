app-id: com.oramasearch.Liquify
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: liquify
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
modules:
  - name: liquify
    buildsystem: simple
    build-commands:
      - install -Dm755 liquify /app/bin/liquify
    sources:
      - type: file
        path: liquify
